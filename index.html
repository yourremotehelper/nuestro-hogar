<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b7f6a">
<title>Nuestro Hogar</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="top">
    <h1 id="viewTitle">Nuestro Hogar</h1>
    <button id="backBtn" class="icon-btn hidden" aria-label="Volver">‹</button>
  </header>
  <main id="view"><p class="loading">Cargando…</p></main>
  <nav class="bottom hidden" id="nav">
    <button data-view="inicio"><span>🏠</span>Inicio</button>
    <button data-view="tareas"><span>✅</span>Tareas</button>
    <button data-view="compra"><span>🛒</span>Compra</button>
    <button data-view="dinero"><span>💶</span>Dinero</button>
    <button data-view="mas"><span>☰</span>Más</button>
  </nav>
</div>
<dialog id="sheet"><form method="dialog" id="sheetForm"></form></dialog>
<dialog id="ask" class="ask"><form method="dialog"><p></p><div class="sheet-actions"><button class="btn ghost" value="no">Cancelar</button><button class="btn" value="ok">Sí</button></div></form></dialog>
<div id="toast" class="toast"></div>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
